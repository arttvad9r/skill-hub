name: Bug report
description: Report incorrect installer, profile, detection, or skill behavior
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the command, expected behavior, and actual behavior.
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Version
      description: Paste `skillhub --version`, the release tag/commit, and Claude Code/Codex version if relevant.
      placeholder: |
        skillhub 0.4.1
        v0.4.1 / <commit>
        Claude Code ... / Codex ...
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Skill Hub status
      description: Paste `skillhub status <project>` when the project has a `.skillhub.toml` manifest.
      render: text
  - type: textarea
    id: safety
    attributes:
      label: Did this overwrite/delete files or affect unmanaged content?
      description: If yes, stop reproducing on valuable data and describe the impact.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, shell, agent, and relevant profile(s).
    validations:
      required: true
